server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 下载接口走这里，三点必须显式设置：
        # 1) 关闭响应缓冲：默认会把整个响应先落到 nginx 临时文件再发给客户端，
        #    大文件首字节延迟翻倍、磁盘 IO 翻倍，并发能力直接砍半
        # 2) 临时文件上限归零：即使有缓冲指令残留也不会落盘
        # 3) 超时放宽：默认 120s 会把超过两分钟的大文件下载直接切断
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # tus 上传：同域名前置代理到 tusd
    # 路径保持 /files/ 原样转发，与 tusd 的 -base-path=/files/ 对齐
    # ------------------------------------------------------------------
    location /files/ {
        proxy_pass http://tusd:1080;

        proxy_http_version 1.1;
        # $http_host 保留端口，tusd 生成的 Location 才能带回正确端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # 不向后端复用连接，避免分片请求相互干扰
        proxy_set_header Connection "";

        # 关键三项：
        # 1) 不限制请求体（默认 1m 会让 8MB 分片直接 413）
        # 2) 不在 nginx 落盘缓冲分片，边收边转发
        # 3) 关闭响应缓冲，tus 的 HEAD/PATCH 响应实时返回
        client_max_body_size 0;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
        proxy_buffering off;

        # 大文件慢速分片可能持续很久
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
