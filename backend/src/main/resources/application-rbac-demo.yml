server:
  port: 8081

spring:
  datasource:
    # HSQLDB 文件模式：自建角色/用户/约束在后端重启后仍保留；删除 backend/data 目录可重置演示数据。
    # jsonb 是给学习业务实体用的 PostgreSQL 类型，这里用 HSQLDB DOMAIN 兼容。
    url: jdbc:hsqldb:file:./data/rbac;shutdown=true;sql.syntax_pgs=true;hsqldb.lock_file=false
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-hsqldb.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.HSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  ai:
    openai:
      api-key: sk-rbac-demo-not-used

app:
  auth:
    dev-mode: true
    seed-enabled: true
    secure-cookie: false
    jwt:
      secret: rbac3-demo-secret-please-change-in-production-2026
      access-ttl-minutes: 15
      refresh-ttl-days: 7
    sso:
      client-id: learning-web
      client-secret: sso-demo-secret
      provider: OIDC-DEMO
      redirect-uris:
        - http://localhost:5173/sso/callback
        - http://127.0.0.1:5173/sso/callback
        - http://localhost:8081/sso/callback
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        # 仅在演示 profile 暴露 shutdown，用于优雅关闭 HSQLDB 文件库
        include: health,shutdown
  endpoint:
    shutdown:
      enabled: true

logging:
  level:
    com.example.learning.auth: DEBUG
