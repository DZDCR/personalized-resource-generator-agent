server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
  application:
    name: learning-agent-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/learning
    username: learning
    password: learning123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: learning123
  ai:
    openai:
      # Key 通过环境变量 OPENAI_API_KEY 注入，切勿把真实 Key 写进本文件
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      # 默认走 DeepSeek 的 OpenAI 兼容接口（国内直连）；可用 OPENAI_BASE_URL 覆盖
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7

spring.rabbitmq:
  host: localhost
  port: 5672
  username: learning
  password: learning123

app:
  auth:
    # 生产环境务必通过环境变量覆盖密钥，并关闭 dev-mode
    dev-mode: ${AUTH_DEV_MODE:false}
    seed-enabled: ${AUTH_SEED_ENABLED:true}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    jwt:
      secret: ${AUTH_JWT_SECRET:learning-agent-rbac3-dev-secret-change-me-2026}
      issuer: ${AUTH_JWT_ISSUER:learning-agent}
      access-ttl-minutes: ${AUTH_ACCESS_TTL_MINUTES:15}
      refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:7}
    sso:
      client-id: ${AUTH_SSO_CLIENT_ID:learning-web}
      client-secret: ${AUTH_SSO_CLIENT_SECRET:sso-demo-secret}
      provider: ${AUTH_SSO_PROVIDER:OIDC-DEMO}
    lock:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      lock-minutes: ${AUTH_LOCK_MINUTES:15}
    cors:
      allowed-origins:
        - ${AUTH_CORS_ORIGIN:http://localhost:5173}
  qdrant:
    host: localhost
    port: 6333
    collection: learning_resources
  llm:
    # 模型路由：长文档用推理模型，画像/短对话用对话模型（DeepSeek）
    heavy-model: deepseek-reasoner
    light-model: deepseek-chat
    max-retries: 3
    timeout-sec: 120
  resources:
    # 生成资源的根目录
    storage-root: ./data/resources
  path:
    checkpoint-pass-rate: 0.8
  im:
    # 课程演示：首次启动自动创建三名学生与一个课程群；生产可改为 false
    seed-demo: true

logging:
  level:
    com.example.learning: DEBUG