spring:
  datasource:
    url: jdbc:h2:mem:learningdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
  ai:
    openai:
      api-key: sk-placeholder
      base-url: http://localhost:1
server:
  port: 8080
app:
  im:
    seed-demo: true
logging:
  level:
    com.example.learning: INFO
